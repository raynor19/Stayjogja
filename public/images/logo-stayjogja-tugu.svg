<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="tuguGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="jogjaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gununganLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Squircle Base App Icon -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#jogjaBg)" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Gunungan Jawa / Kayon Outer Silhouette (Simbol Filosofi Kehidupan & Naungan Budaya Jogja) -->
  <path d="M 60 12 
           C 66 22 76 27 82 34 
           C 88 41 89 48 83 54 
           C 92 60 93 72 86 80 
           C 84 83 80 86 76 88
           L 76 96 L 44 96 L 44 88
           C 40 86 36 83 34 80
           C 27 72 28 60 37 54
           C 31 48 32 41 38 34
           C 44 27 54 22 60 12 Z" 
        fill="none" 
        stroke="url(#gununganLine)" 
        stroke-width="2" 
        stroke-opacity="0.35" />

  <!-- Atap Joglo Keraton (Lengkungan Naungan Penginapan / Stay) -->
  <path d="M 22 62 C 34 58 46 50 60 45 C 74 50 86 58 98 62" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-opacity="0.9" />

  <!-- ================= TUGU YOGYAKARTA (MONUMEN PAL PUTIH) ================= -->
  
  <!-- 1. Puncak Jarum Emas & Bola Golong (Tugu Finial) -->
  <!-- Ujung Lancip Spire -->
  <polygon points="60,16 62.5,27 57.5,27" fill="url(#tuguGold)" />
  <!-- Bola Emas Golong -->
  <circle cx="60" cy="29.5" r="2.5" fill="#fde047" />
  <!-- Leher Penyangga Puncak -->
  <rect x="58.5" y="32" width="3" height="2" fill="#f59e0b" rx="0.5" />

  <!-- 2. Mahkota / Kepala Tugu Bertingkat (Cornice Capital) -->
  <polygon points="56,34 64,34 65.5,37 54.5,37" fill="#ffffff" />
  <rect x="53.5" y="37" width="13" height="2.5" fill="#f59e0b" rx="0.5" />
  <polygon points="55,39.5 65,39.5 64,43 56,43" fill="#ffffff" />

  <!-- 3. Batang Tiang Tugu Pal Putih (Tapering Obelisk Shaft) -->
  <!-- Badan Kiri (Terang) -->
  <polygon points="56,43 60,43 60,74 54.5,74" fill="#ffffff" />
  <!-- Badan Kanan (Bayangan Dimensi) -->
  <polygon points="60,43 64,43 65.5,74 60,74" fill="#e2e8f0" />
  <!-- Garis Tengah Emas -->
  <line x1="60" y1="43" x2="60" y2="74" stroke="#d97706" stroke-width="0.8" />

  <!-- 4. Sabuk Tengah Ornamen Tugu -->
  <rect x="55.5" y="56" width="9" height="2" fill="#f59e0b" rx="0.5" />

  <!-- 5. Kaki & Pedestal Tugu Bertingkat (Prasasti & Umpak Kaki) -->
  <!-- Plinth Tingkat 1 -->
  <rect x="52" y="74" width="16" height="3" fill="#ffffff" rx="0.5" />
  <!-- Plinth Tingkat 2 dengan Aksen Emas -->
  <rect x="49" y="77" width="22" height="3.5" fill="#f59e0b" rx="0.8" />
  
  <!-- Ulir / Sayap Ornamen Khas Kaki Tugu Jogja (Kanan & Kiri) -->
  <path d="M 49 79 C 45 79 43 83 46 86 C 48 86 50 84 49 81" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 71 79 C 75 79 77 83 74 86 C 72 86 70 84 71 81" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" />

  <!-- Dasar Pondasi Tugu (Umpak Utama) -->
  <polygon points="46,80.5 74,80.5 77,87 43,87" fill="#ffffff" />
  <rect x="40" y="87" width="40" height="4" fill="url(#tuguGold)" rx="1.5" />

  <!-- Tulisan Kecil Aksara / Aksen Yogyakarta -->
  <circle cx="60" cy="89" r="1.2" fill="#0f172a" />
  <circle cx="53" cy="89" r="0.9" fill="#0f172a" />
  <circle cx="67" cy="89" r="0.9" fill="#0f172a" />
</svg>
