<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" width="100%" height="100%">
  <defs>
    <linearGradient id="corpGoldLockup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="corpNavyLockup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1e" />
      <stop offset="100%" stop-color="#14213d" />
    </linearGradient>
  </defs>

  <!-- Left Icon Container (Prambanan + Tugu Mark) -->
  <g transform="translate(10, 10) scale(0.5)">
    <rect x="5" y="5" width="110" height="110" rx="28" fill="url(#corpNavyLockup)" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- Candi Prambanan Kiri -->
    <path d="M 28 26 L 30 32 L 26 32 Z" fill="url(#corpGoldLockup)" />
    <path d="M 25 33 L 31 33 L 33 41 L 23 41 Z" stroke="url(#corpGoldLockup)" stroke-width="2" fill="none" />
    <path d="M 22 42 L 34 42 L 36 53 L 20 53 Z" stroke="url(#corpGoldLockup)" stroke-width="2" fill="none" />
    <path d="M 19 54 L 37 54 L 38 70 L 18 70 Z" stroke="url(#corpGoldLockup)" stroke-width="2.2" fill="none" />
    <path d="M 17 71 L 39 71 L 39 88 L 17 88" stroke="url(#corpGoldLockup)" stroke-width="2" fill="none" />

    <!-- Candi Prambanan Kanan -->
    <path d="M 92 26 L 94 32 L 90 32 Z" fill="url(#corpGoldLockup)" />
    <path d="M 89 33 L 95 33 L 97 41 L 87 41 Z" stroke="url(#corpGoldLockup)" stroke-width="2" fill="none" />
    <path d="M 86 42 L 98 42 L 100 53 L 84 53 Z" stroke="url(#corpGoldLockup)" stroke-width="2" fill="none" />
    <path d="M 83 54 L 101 54 L 102 70 L 82 70 Z" stroke="url(#corpGoldLockup)" stroke-width="2.2" fill="none" />
    <path d="M 81 71 L 103 71 L 103 88 L 81 88" stroke="url(#corpGoldLockup)" stroke-width="2" fill="none" />

    <!-- Tugu Pal Putih Pusat -->
    <polygon points="60,13 63.5,23 56.5,23" fill="url(#corpGoldLockup)" />
    <circle cx="60" cy="13" r="1.5" fill="#ffffff" />
    <circle cx="60" cy="26" r="2.8" fill="#fef08a" stroke="#d97706" stroke-width="0.8" />
    <rect x="58" y="29" width="4" height="2" fill="#f59e0b" rx="0.5" />
    <polygon points="54,31 66,31 68,34.5 52,34.5" fill="#ffffff" />
    <rect x="50" y="34.5" width="20" height="2.5" fill="url(#corpGoldLockup)" rx="0.5" />
    <polygon points="53,37 67,37 66,40.5 54,40.5" fill="#ffffff" />
    
    <!-- Batang Tugu -->
    <polygon points="54,40.5 60,40.5 60,73 53,73" fill="#ffffff" />
    <polygon points="60,40.5 66,40.5 67,73 60,73" fill="#e2e8f0" />
    <line x1="60" y1="40.5" x2="60" y2="73" stroke="#f59e0b" stroke-width="0.9" />
    <rect x="54.5" y="54" width="11" height="2.2" fill="url(#corpGoldLockup)" rx="0.5" />

    <!-- Kaki Tugu & Gerbang Putih -->
    <path d="M 39 94 L 39 74 C 39 63 48 57 60 57 C 72 57 81 63 81 74 L 81 94" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <polygon points="51,73 69,73 71,77 49,77" fill="#ffffff" />
    <rect x="46" y="77" width="28" height="3.5" fill="url(#corpGoldLockup)" rx="0.8" />
    <polygon points="42,85 78,85 82,92 38,92" fill="#ffffff" />
    <rect x="34" y="92" width="52" height="4" fill="url(#corpGoldLockup)" rx="1.5" />
  </g>

  <!-- Typography: StayJogja Wordmark -->
  <text x="82" y="47" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5" fill="#0f172a">
    Stay<tspan fill="#d4af37">Jogja</tspan>
  </text>
  
  <!-- Sub-wordmark / Corporate Tagline -->
  <text x="83" y="62" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="9" font-weight="700" letter-spacing="2.2" fill="#64748b" text-transform="uppercase">
    Prambanan &amp; Tugu Heritage Stays
  </text>
</svg>
